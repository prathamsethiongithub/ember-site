<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#333}</style></head>
<body>
<script src="vendor/three.min.js"></script>
<script src="assets/skin-data.js"></script>
<script src="skinchar.js"></script>
<script>
var r = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
r.setSize(1200,420); r.setClearColor(0x333333); document.body.appendChild(r.domElement);
var s = new THREE.Scene();
s.add(new THREE.AmbientLight(0xffffff, 0.85));
var d = new THREE.DirectionalLight(0xffffff, 0.7); d.position.set(1,3,4); s.add(d);
// four heads, four orientations: rotation.y = 0(face +z), PI/2, PI, 3PI/2
var waits = [];
[0, Math.PI/2, Math.PI, -Math.PI/2].forEach(function(rot, i){
  var SC = window.buildSkinCharacter();
  SC.root.position.set(-2.25 + i*1.5, 0, 0);
  SC.root.rotation.y = rot;
  SC.root.scale.set(1.4,1.4,1.4);
  s.add(SC.root);
  waits.push(SC.ready);
});
var cam = new THREE.PerspectiveCamera(26, 1200/420, 0.1, 60);
cam.position.set(0, 2.1, 11); cam.lookAt(0, 1.0, 0);
Promise.all(waits).then(function(){ render(); window.__shotReady = 1; });
function render(){ r.render(s, cam); }
render();
</script></body></html>
